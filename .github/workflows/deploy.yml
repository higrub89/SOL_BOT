name: 🚀 Deploy Bot to GCP (Institutional Grade)

on:
  push:
    branches: [ master ]
    paths:
      - 'core/**'
      - 'intelligence/**'
      - 'polymarket/**'
      - 'settings.json'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del deploy manual'
        required: false
        default: 'Calibración manual'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/the_chassis

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: ECU - Detección Quirúrgica de Cambios
  # ──────────────────────────────────────────────
  detect:
    name: 🔍 Detectar Cambios
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
      config_changed: ${{ steps.filter.outputs.config }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Filtrar cambios
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'core/**'
              - 'intelligence/**'
              - 'polymarket/**'
              - 'Cargo.toml'
              - 'Dockerfile'
              - '.github/workflows/**'
            config:
              - 'settings.json'
              - 'docker-compose.yml'

  # ──────────────────────────────────────────────
  # JOB 2: Compilación y Ensamblaje en Pit-Lane
  # ──────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.code_changed == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libssl-dev pkg-config

      - name: 🦀 Instalar Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Cache Cargo (Optimización Térmica)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: ✅ Verificar integridad estructural (Fail-Fast)
        run: cargo check --workspace --release

      - name: 🔐 Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: ⚡ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build y Push a GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ──────────────────────────────────────────────
  # JOB 3: Inyección en Bare-Metal (Zero-Downtime)
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy a Producción
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.detect.outputs.code_changed == 'true' || needs.detect.outputs.config_changed == 'true')

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔐 Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.GCP_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 📤 Sincronizar telemetría (Rsync estricto)
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='target/' \
            --exclude='logs/' \
            --exclude='trading_state.db' \
            --exclude='.env' \
            --exclude='*.bak' \
            --exclude='core/' \
            --exclude='intelligence/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.GCP_USER }}@${{ secrets.GCP_SERVER_IP }}:~/bot_trading/

      - name: 🔄 Ejecución de Despliegue Crítico (con Rollback)
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Inyección de secretos cifrados vía entorno, no en el comando
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ env.IMAGE_NAME }}
          CODE_CHANGED: ${{ needs.detect.outputs.code_changed }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GCP_SERVER_IP }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          timeout: 5m
          envs: GH_TOKEN,ACTOR,IMAGE,CODE_CHANGED,COMMIT_SHA
          script: |
            set -e
            cd ~/bot_trading

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🏎️  THE CHASSIS — Despliegue Institucional"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # 0. MIGRACIÓN DE RUTAS Y LIMPIEZA DE "DIRECTORIOS FANTASMA"
            mkdir -p logs
            # Limpiar si Docker creó directorios por error en intentos fallidos previos
            for f in settings.json pools_cache.json trading_state.db; do
              if [ -d "$f" ]; then
                echo "🗑️  Eliminando directorio erróneo '$f' creado por Docker..."
                sudo rm -rf "$f"
              fi
            done

            if [ -d "core/the_chassis" ]; then
              echo "🔄 Migrando archivos de configuración desde core/the_chassis..."
              [ -f "core/the_chassis/settings.json" ] && [ ! -e "settings.json" ] && mv core/the_chassis/settings.json ./settings.json
              [ -f "core/the_chassis/pools_cache.json" ] && [ ! -e "pools_cache.json" ] && mv core/the_chassis/pools_cache.json ./pools_cache.json
              [ -f "core/the_chassis/trading_state.db" ] && [ ! -e "trading_state.db" ] && mv core/the_chassis/trading_state.db ./trading_state.db
              echo "✅ Migración completada."
            fi

            # 1. Asegurar archivos de persistencia (Prevenir directorios de Docker)
            touch settings.json pools_cache.json trading_state.db
            
            # 2. Login seguro
            echo "$GH_TOKEN" | sudo docker login ghcr.io -u "$ACTOR" --password-stdin

            if [ "$CODE_CHANGED" == "true" ]; then
              echo "🐳 Descargando nueva imagen de GHCR..."
              
              # Crear punto de restauración
              sudo docker tag $IMAGE:latest $IMAGE:rollback || true
              
              # Descargar la nueva compilación
              sudo docker pull $IMAGE:latest

              # Sustitución sin desconexión
              echo "⚡ Realizando hot-swap del contenedor..."
              sudo docker compose up -d --no-deps bot
              
              echo "⏳ Evaluando estabilidad del motor (15s)..."
              sleep 15
              
              # Healthcheck de supervivencia (usar container_name, NO service name)
              STATUS=$(sudo docker inspect -f '{{.State.Status}}' solana_trading_bot 2>/dev/null || echo "not_found")
              echo "📊 Estado del contenedor: $STATUS"
              if [ "$STATUS" != "running" ]; then
                echo "💥 ALERTA CRÍTICA: Falla de encendido detectada."
                echo "🔄 Iniciando protocolo ROLLBACK inmediato..."
                
                sudo docker tag $IMAGE:rollback $IMAGE:latest
                sudo docker compose up -d --no-deps bot
                
                echo "❌ Despliegue abortado. Motor restaurado."
                exit 1
              fi
            else
              echo "📂 MODO CALIBRACIÓN: Aplicando configuración en caliente..."
              sudo docker compose up -d bot
              sudo docker compose restart bot
            fi

            echo "✅ Ingeniería acoplada con éxito."

      - name: 📱 Notificación a Centro de Mando (Telegram)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="🟢"
            MSG="DESPLIEGUE EXITOSO"
          else
            EMOJI="🔴"
            MSG="FALLO EN DESPLIEGUE / ROLLBACK EJECUTADO"
          fi

          CODE_CHANGED="${{ needs.detect.outputs.code_changed }}"
          if [ "$CODE_CHANGED" = "true" ]; then
            DEPLOY_TYPE="🐳 Inyección de Nuevo Binario (C/Rust)"
          else
            DEPLOY_TYPE="⚡ Calibración de ECU (Configuración)"
          fi

          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>${EMOJI} THE CHASSIS — ${MSG}</b>
          <b>━━━━━━━━━━━━━━━━━━━━━━</b>
          <b>⬡ Commit:</b> <code>${SHORT_SHA}</code>
          <b>⬡ Tipo:</b> ${DEPLOY_TYPE}
          <b>⬡ Autor:</b> ${{ github.actor }}

          <i>Sistema operando bajo estándares de excelencia.</i>"