name: 🚀 Deploy Bot to GCP

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  PROJECT_ID: project-828d4ae0-6385-40d2-aa6
  INSTANCE_NAME: solana-bot-v1
  ZONE: us-east4-b
  REGION: europe-west1
  REPOSITORY: the-chassis-repo
  IMAGE_NAME: bot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Install Protobuf Compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 💅 Check Format
        run: cargo fmt --all -- --check

      - name: 🔍 Run Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: 🧪 Run Tests
        env:
          HELIUS_API_KEY: "mock_for_ci"
          JUPITER_API_KEY: "mock_for_ci"
          WALLET_PRIVATE_KEY: "mock_for_ci"
          GEYSER_ENDPOINT: "mock_for_ci"
        run: cargo test --workspace

      - name: 🔒 Audit dependencies
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

      - name: ✅ Validate required secrets
        shell: bash
        env:
          WIF_PROVIDER_NAME: ${{ secrets.WIF_PROVIDER_NAME }}
          GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
        run: |
          set -euo pipefail

          missing=0
          if [ -z "${WIF_PROVIDER_NAME}" ]; then
            echo "::error::Missing required secret: WIF_PROVIDER_NAME"
            missing=1
          fi
          if [ -z "${GCP_SA_EMAIL}" ]; then
            echo "::error::Missing required secret: GCP_SA_EMAIL"
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            echo "::error::Secrets are unavailable in this run context. If this is a fork/Dependabot PR or environment mismatch, GitHub will not expose repository secrets."
            exit 1
          fi

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: 🔧 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🐳 Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 🏗️ Build and Push Image
        run: |
          IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          docker build -f operational/deploy/Dockerfile -t $IMAGE_URL .
          docker push $IMAGE_URL

      - name: 🔄 Update Startup Script & Reset GCE Instance
        run: |
          IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"

          cat > /tmp/startup.sh << 'STARTUP_EOF'
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/chassis-startup.log|logger -t startup-script -s 2>/dev/console) 2>&1
          echo "🚀 THE CHASSIS — Startup Script v3.1 (Persistent Volume Support)"
          
          # 1. Setup Docker
          if ! command -v docker &> /dev/null; then
            apt-get update && apt-get install -y docker.io
            systemctl start docker && systemctl enable docker
          fi
          
          # 2. Setup Persistent Disk (if attached)
          DATA_DISK="/dev/disk/by-id/google-chassis-data"
          MOUNT_POINT="/mnt/disks/chassis_data"
          
          if [ -b "$DATA_DISK" ]; then
            echo "💾 Disco persistente detectado ($DATA_DISK). Preparando montaje..."
            mkdir -p $MOUNT_POINT
            # Formatear solo si no tiene sistema de archivos
            if ! blkid "$DATA_DISK" > /dev/null; then
              mkfs.ext4 -m 0 -E lazy_itable_init=0,lazy_journal_init=0,discard "$DATA_DISK"
            fi
            # Montar si no está montado
            if ! mount | grep -q "$MOUNT_POINT"; then
              mount -o discard,defaults "$DATA_DISK" $MOUNT_POINT
            fi
            echo "✅ Disco persistente montado en $MOUNT_POINT"
          else
            echo "⚠️  Disco persistente NO detectado. Usando almacenamiento local (no persistente)."
            mkdir -p $MOUNT_POINT
          fi

          # 3. Docker Auth & Pull
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          PROJECT_ID="__PROJECT_ID__"
          ENV_FILE="/root/.chassis.env"
          touch $ENV_FILE && chmod 600 $ENV_FILE
          
          fetch_secret() {
            gcloud secrets versions access latest --secret="$1" --project="$PROJECT_ID" --quiet 2>/dev/null
          }
          
          echo "📥 Recuperando secretos..."
          H_KEY=$(fetch_secret HELIUS_API_KEY)
          W_KEY=$(fetch_secret CHASSIS_WALLET_KEY)
          W_ADDR=$(fetch_secret WALLET_ADDRESS)
          T_TOKEN=$(fetch_secret TELEGRAM_BOT_TOKEN)
          T_ID=$(fetch_secret TELEGRAM_CHAT_ID)
          
          cat <<ENV_EOF > $ENV_FILE
          HELIUS_API_KEY=$H_KEY
          WALLET_PRIVATE_KEY=$W_KEY
          WALLET_ADDRESS=$W_ADDR
          TELEGRAM_BOT_TOKEN=$T_TOKEN
          TELEGRAM_CHAT_ID=$T_ID
          HUNTER_MODE=devnet
          RUST_LOG=info
          ENV_EOF
          
          # 4. Generate settings.json (Institutional Default)
          SETTINGS_FILE="/root/settings.json"
          cat <<SETTINGS_EOF > $SETTINGS_FILE
          {
              "global_settings": {
                  "min_sol_balance": 0.01,
                  "jito_tip_lamports": 5000,
                  "monitor_interval_sec": 10,
                  "auto_execute": true
              }
          }
          SETTINGS_EOF

          echo "✅ Secretos y configuraciones cargados."
          DOCKER_IMAGE="__IMAGE_URL__"
          docker pull $DOCKER_IMAGE
          docker stop solana_trading_bot 2>/dev/null || true
          docker rm solana_trading_bot 2>/dev/null || true
          
          echo "⚡ Arrancando contenedor con configuración montada..."
          docker run -d \
            --name solana_trading_bot \
            --restart always \
            --cap-add=SYS_NICE \
            --ulimit rtprio=99 \
            --env-file $ENV_FILE \
            -e DB_PATH=/app/data/trading_state.db \
            -v $MOUNT_POINT:/app/data \
            -v $SETTINGS_FILE:/app/settings.json \
            $DOCKER_IMAGE \
            ./the_chassis_app monitor
          
          echo "🏎️ THE CHASSIS online."
          STARTUP_EOF

          sed -i "s|__PROJECT_ID__|${{ env.PROJECT_ID }}|g" /tmp/startup.sh
          sed -i "s|__IMAGE_URL__|${IMAGE_URL}|g" /tmp/startup.sh

          gcloud compute instances add-metadata ${{ env.INSTANCE_NAME }} \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --metadata-from-file=startup-script=/tmp/startup.sh

          gcloud compute instances reset ${{ env.INSTANCE_NAME }} \
            --zone=${{ env.ZONE }} \
            --project=${{ env.PROJECT_ID }}

      - name: 📱 Telegram Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="🟢"
            MSG="DESPLIEGUE AUTOMÁTICO EXITOSO"
          else
            EMOJI="🔴"
            MSG="FALLO EN DESPLIEGUE CI/CD"
          fi
          
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="<b>${EMOJI} THE CHASSIS — ${MSG}</b>
          <b>━━━━━━━━━━━━━━━━━━━━━━</b>
          <b>⬡ Commit:</b> <code>${{ github.sha }}</code>
          <b>⬡ Registry:</b> GCP Artifact Registry
          <b>⬡ Target:</b> ${{ env.INSTANCE_NAME }}
          
          <i>Motor reiniciado y sincronizado con la última compilación.</i>"
