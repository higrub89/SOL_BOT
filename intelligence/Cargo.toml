[package]
name = "intelligence_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
prost = "0.14"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tokio = { version = "1.0", features = ["sync", "net", "rt", "macros", "io-util"] }
futures-util = "0.3"
tokio-stream = "0.1"

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"

[features]
hft-profile = []
