[package]
name = "the_chassis"
version = "0.9.0"
edition = "2021"
authors = ["Ruben"]
description = "High-performance Solana trading engine - The Chassis"
default-run = "the_chassis_app"

[dependencies]
# Solana Core (alineado a v2.3.x)
solana-client = "2.3.13"
solana-sdk = "2.3.1"
solana-account-decoder = "2.3.13"
solana-program = "2.3.0"
solana-system-interface = "3.2.0"
# Pinning alineado con Solana 2.3.x
spl-token = { version = "6.0.0", default-features = false, features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0.0", default-features = false, features = ["no-entrypoint"] }
spl-memo = { version = "6.0.0", default-features = false, features = ["no-entrypoint"] }
libc = "0.2"

# Async Runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
tokio-stream = "0.1"

# gRPC & Protobuf (Comunicación Rust ↔ Python)
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
tonic-build = "0.12"

# Observability - Telemetría de Hiperlujo
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Security - Manejo seguro de secretos
secrecy = { version = "0.7", features = ["serde"] }
zeroize = "1.3"

# WebSocket & Network
tokio-tungstenite = { version = "0.23", default-features = false, features = ["native-tls", "connect"] }
futures-util = "0.3"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["use-std"] }
base64 = "0.21"
bs58 = "0.5"

# Utilities
anyhow = "1.0"
chrono = "0.4"
dotenvy = "0.15"
webbrowser = "0.8" # ⚡ Para abrir Jupiter automáticamente
rand = "0.8"
arrayvec = "0.7"
smallvec = "1.13"
teloxide = { version = "0.12", features = ["macros"] } # 📱 Telegram notifications
clap = { version = "4.0", features = ["derive"] } # 🚀 CLI Argument handling
bytemuck = "1.25.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
deadpool-sqlite = "0.8.0"
dashmap = "6.0"
intelligence_rs = { path = "../intelligence" }
lazy_static = "1.5.0"
itertools = "0.14.0"
regex = "1.7"

[features]
e2e-network = []
hft-profile = []

[[bin]]
name = "the_chassis_app"
path = "src/bin/main.rs"

[[bin]]
name = "test_apis"
path = "src/bin/test_apis.rs"

[build-dependencies]
tonic-build = { version = "0.12", features = ["prost"] }
prost-build = { version = "0.13" }
protobuf-src = "2.1"
